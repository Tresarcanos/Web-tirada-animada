<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Selecciona 3 Cartas</title>

<style>

body{
  font-family: Arial, sans-serif;
  text-align:center;
  margin:0;
  min-height:100vh;

  background: radial-gradient(circle at center, #2c1b47 0%, #120b1f 60%, #000000 100%);
  color: white;
}

h1{
  margin-top:20px;
}

/* CONTENEDOR GENERAL TIPO ABANICO VISTA DORSO*/
.cartas{
  position: relative;
  width: 100%;
  height: 500px;
  margin: 60px auto;
}

/* CARTA */
.carta{
  width:150px;        /* ⬅️ ANCHO */
  height:250px;       /* ⬅️ ALTO */
  perspective:1000px; /* profundidad 3D */
  cursor:pointer;
  position:absolute; 
  transition: all 0.6s ease; 
  overflow: visible;
}

/* BLOQUEA CLICKS CUANDO TERMINA */
.carta.bloqueada{
  pointer-events:none;
  opacity:0.6;
}

/* CONTENEDOR QUE GIRA */
.inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition: transform 0.8s;
}

/* GIRO NORMAL */
.carta.flip .inner{
  transform: rotateY(180deg);
}

/* GIRO INVERTIDO */
.carta.invertida.flip .inner{
  transform: rotateY(180deg) rotate(180deg);
}

/* CARAS */
.frente, .dorso{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* ESPALDA */
.dorso{
  background-image:url('img/back.jpeg');
}

/* FRENTE */
.frente{
  transform: rotateY(180deg);
}

/* FEEDBACK VISUAL CUANDO SE SELECCIONA */

.carta.seleccionada {
  transform: translateY(-35px); /* pequeño salto hacia arriba */
}

.carta.zoomFinal{
  transform: scale(1.9);
}

.carta.seleccionada .inner {
  box-shadow: 0 0 20px gold;
}

/* Numerito que aparece arriba */
.marcador {
  position: absolute;
  top: -10px;
  right: -10px;
  background: gold;
  color: black;
  font-weight: bold;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
}

.mezclando{
  animation:mezclar 0.6s ease-in-out infinite alternate;
}

.carta.zoom{
  transform: scale(1.6);
  transition: transform 0.6s ease;
}


@keyframes mezclar{
  from{ transform: translateY(-10px); }
  to{ transform: translateY(10px); }
}

button{
  padding:10px 20px;
  margin-top:20px;
  font-size:16px;
  cursor:pointer;
}
/* 🔮 Nombre debajo de cada carta */
.nombreCarta{
  position: absolute;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-weight: bold;
  font-size: 13px;
  text-shadow: 0 0 10px black;
    z-index: 2000;

}

/* 🌑 Capa oscura al revelar cartas */
.overlayOscuro {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.50);
  backdrop-filter: blur(4px);
  z-index: 500;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.overlayOscuro.activo {
  opacity: 1;
}

</style>
</head>

<body>

<h1>Tirada de 3 cartas</h1>
<p>Concentrate y elegí tres cartas</p>

<button id="btnIniciar" onclick="iniciarTirada()">Mezclar y comenzar</button>

<!-- 🔊 Sonidos -->
<audio id="sonidoClick" src="sound/select2.mp3" preload="auto"></audio>
<audio id="sonidoRevelar" src="sound/revelar2.mp3" preload="auto"></audio>

<div id="overlayOscuro" class="overlayOscuro"></div>
<div id="mensajeConfirmacion" style="margin-top:20px;font-size:18px;"></div>


<div class="cartas" id="mazo"></div>
<div id="resultado" style="margin-top:30px;font-size:18px;"></div>
<button id="btnSiguiente" style="
  display:none;
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  z-index:2000;
  padding:14px 28px;
  font-size:18px;
  background:gold;
  color:black;
  border:none;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
">
  Elegí las cartas para tu siguiente revelación
</button>

<script>

const arcanos = {
0: "El Loco",
1: "El Mago",
2: "La Sacerdotisa",
3: "La Emperatriz",
4: "El Emperador",
5: "El Sumo Sacerdote",
6: "Los Enamorados",
7: "El Carro",
8: "La Fuerza",
9: "El Ermitaño",
10: "La Rueda de la Fortuna",
11: "La Justicia",
12: "El Colgado",
13: "La Muerte",
14: "La Templanza",
15: "El Diablo",
16: "La Torre",
17: "La Estrella",
18: "La Luna",
19: "El Sol",
20: "El Juicio",
21: "El Mundo"
};

// ==============================
// 🔮 Integración con Make (envío de cartas seleccionadas)
// ==============================

function enviarCartasAMake(cartas, nombres, invertidas) {

  fetch("https://hook.us2.make.com/7xrl0mmvpfoanbwg506hcfqmev21x17g", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    bbody: JSON.stringify({
      order_id: orderId,
  

      carta_1_num: cartas[0],
      carta_1_nombre: nombres[0],
      carta_1_invertida: invertidas[0],

      carta_2_num: cartas[1],
      carta_2_nombre: nombres[1],
      carta_2_invertida: invertidas[1],

      carta_3_num: cartas[2],
      carta_3_nombre: nombres[2],
      carta_3_invertida: invertidas[2]
    })
  })
  .then(() => {
    document.getElementById("mensajeConfirmacion").innerHTML =
      "✨ Tus cartas fueron registradas correctamente ✨";
  })
  .catch(() => {
    document.getElementById("mensajeConfirmacion").innerHTML =
      "⚠ Error al registrar la tirada";
  });

}

// ==============================
// 🔮 DATOS RECIBIDOS DESDE LA URL (Make / Tienda)
// ==============================

const params = new URLSearchParams(window.location.search);
const orderId = params.get("orden");
const cantidadPreguntas = parseInt(params.get("preguntas"));
const cartasPorTirada = 3;

if (!orderId || !cantidadPreguntas) {
  document.getElementById("mensajeConfirmacion").innerHTML =
    "⚠ No se detectaron datos de orden en el enlace.";
}


let mazo = Array.from({length: 22}, (_, i) => i);
let seleccionadas=[];
let cartasDOM=[];
let tiradaActiva=false;
let tiradaActual = 1;

document.getElementById("btnSiguiente").addEventListener("click", function() {

  tiradaActual++;

  this.style.display = "none";

  seleccionadas = [];
  cartasDOM = [];
  contenedor.innerHTML = "";
  document.getElementById("overlayOscuro").classList.remove("activo");

  iniciarTirada();

});


const contenedor=document.getElementById("mazo");

/* MEZCLA VISUAL + REAL */
function iniciarTirada(){
  document.getElementById("btnIniciar").disabled = true;

  seleccionadas=[];
  contenedor.innerHTML="";
  tiradaActiva=true;

  // Fisher-Yates real
  for(let i=mazo.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [mazo[i], mazo[j]]=[mazo[j], mazo[i]];
  }

  mazo.forEach((numero, index)=>{

    const carta=document.createElement("div");
    carta.className="carta mezclando";

    const inner=document.createElement("div");
    inner.className="inner";

    const dorso=document.createElement("div");
    dorso.className="dorso";

    const frente=document.createElement("div");
    frente.className="frente";
    frente.style.backgroundImage=`url('img/${numero}.png')`;

    inner.appendChild(dorso);
    inner.appendChild(frente);
    carta.appendChild(inner);

    carta.dataset.numero=numero;
    
    // posicion tipo abanico
let separacion;

if(window.innerWidth < 600){
  separacion = 60;     // celular
}else if(window.innerWidth < 1000){
  separacion = 80;     // tablet
}else{
  separacion = 80;     // desktop
}
const anchoCarta = 120;
const cartasPorFila = 11;

const fila = Math.floor(index / cartasPorFila);
const posicionEnFila = index % cartasPorFila;

const anchoTotal = (cartasPorFila - 1) * separacion + anchoCarta;

carta.style.left = ((window.innerWidth - anchoTotal) / 2 + posicionEnFila * separacion) + "px";

const altoCarta = 190;
const separacionVertical = 280; // distancia entre filas
carta.style.top = (fila * separacionVertical) + "px";
carta.style.zIndex = index;

    carta.onclick=()=>{
      if(!tiradaActiva) return;
      if(seleccionadas.length >= cartasPorTirada) return;
      if(seleccionadas.includes(carta)) return;

      carta.classList.remove("mezclando");
      seleccionadas.push(carta);
      if (seleccionadas.length < 3) {
  const sonido = document.getElementById("sonidoClick");
  sonido.currentTime = 0;
  sonido.play();
}

      // Agrega efecto visual de seleccion
carta.classList.add("seleccionada");

// Crear numerito indicador (1, 2 o 3)
const marcador = document.createElement("div");
marcador.className = "marcador";
marcador.textContent = seleccionadas.length;
carta.appendChild(marcador);


      if(seleccionadas.length === cartasPorTirada){
        revelarCartas();
      }
    };

    cartasDOM.push(carta);
    contenedor.appendChild(carta);
  });

  // corta animación mezcla después de 1.5s
  setTimeout(()=>{
    cartasDOM.forEach(c=>c.classList.remove("mezclando"));
  },1500);
}

function revelarCartas(){
const sonidoRevelar = document.getElementById("sonidoRevelar");
sonidoRevelar.currentTime = 0;
sonidoRevelar.play();


  tiradaActiva=false;

// 🔮 Oscurecer fondo al revelar
  document.getElementById("overlayOscuro").classList.add("activo");


  seleccionadas.forEach((carta, i)=>{

  carta.style.zIndex = 999;

  // Centro horizontal
  const centroX = window.innerWidth / 2;
  const anchoCarta = 220;
  const separacionFinal = 400; // espacio entre las 3 finales
  const desplazamiento = (i - 1) * separacionFinal;

  carta.style.left = (centroX - anchoCarta/2 + desplazamiento) + "px";

  // Centro vertical
  carta.style.top = "80px";

  if(Math.random()<0.5){
    carta.classList.add("invertida");
  }

  carta.classList.add("flip");
  carta.classList.add("zoomFinal");

  // Crear nombre debajo de la carta
const nombre = document.createElement("div");
nombre.className = "nombreCarta";
const numero = parseInt(carta.dataset.numero);
nombre.textContent = arcanos[numero] || "Carta " + numero;

carta.appendChild(nombre);

});


  // bloquea el resto
  cartasDOM.forEach(c=>{
    if(!seleccionadas.includes(c)){
      c.classList.add("bloqueada");
    }
  });

  console.log("Order ID:", orderId);

  // 🔮 Enviar cartas a Make
const numeros = seleccionadas.map(c => parseInt(c.dataset.numero));
const nombres = numeros.map(n => arcanos[n]);

const invertidas = seleccionadas.map(c => 
  c.classList.contains("invertida") ? "invertida" : ""
);

  enviarCartasAMake(numeros, nombres, invertidas);
  console.log("Tirada actual:", tiradaActual, "Cantidad comprada:", cantidadPreguntas);
  
  if (tiradaActual < cantidadPreguntas) {
    console.log("Entró al bloque de siguiente revelación");
    const btn = document.getElementById("btnSiguiente");

  const textoNumero =
    tiradaActual === 1 ? "segunda" :
    tiradaActual === 2 ? "tercera" : "siguiente";

  btn.textContent = "Elegí las cartas para tu " + textoNumero + " revelación";
  btn.style.display = "inline-block";

} else {
  console.log("Todas las tiradas completadas");
}

}  // ← ESTA LLAVE FALTABA

</script>

</body>
</html>
