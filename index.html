<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selecciona 3 Cartas</title>

<style>

body{
  font-family: Arial, sans-serif;
  text-align:center;
  margin:0;
  min-height:100vh;

  background:
  linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)),
  url("img/fondo_web_tirada.png");

background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;
  color: white;
}

h1{
  margin-top:20px;
  font-size: 42px;
  letter-spacing: 2px;

  color: rgba(255, 255, 255, 0.85); /* transparencia */
  
  color: rgba(220, 230, 255, 0.9);

text-shadow:
  0 0 12px rgba(120, 170, 255, 0.7),
  0 0 30px rgba(120, 170, 255, 0.4);

}

/* CONTENEDOR GENERAL TIPO ABANICO VISTA DORSO*/
.cartas{
  position: relative;
  width: 100%;
  height: 500px;
  margin: 60px auto;
}

/* CARTA */
.carta{
  width:150px;        /* ⬅️ ANCHO */
  height:250px;       /* ⬅️ ALTO */
  perspective:1000px; /* profundidad 3D */
  cursor:pointer;
  position:absolute; 
  transition: all 0.6s ease; 
  overflow: visible;
}
/* ajuste para celular */
@media (max-width: 600px) {

  .carta{
    width:100px;
    height:135px;
  }

}

/* BLOQUEA CLICKS CUANDO TERMINA */
.carta.bloqueada{
  pointer-events:none;
  opacity:0.6;
}

/* CONTENEDOR QUE GIRA */
.inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition: transform 0.8s;
}

/* GIRO NORMAL */
.carta.flip .inner{
  transform: rotateY(180deg);
}

/* GIRO INVERTIDO */
.carta.invertida.flip .inner{
  transform: rotateY(180deg) rotate(180deg);
}

/* CARAS */
.frente, .dorso{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* ESPALDA */
.dorso{
  background-image:url('img/back.jpeg');
}

/* FRENTE */
.frente{
  transform: rotateY(180deg);
}

/* FEEDBACK VISUAL CUANDO SE SELECCIONA */

.carta.seleccionada {
  margin-top: -35px;
}

.carta.zoomFinal{
  scale: 1.6;
}

.carta.seleccionada .inner {
  box-shadow:
    0 0 15px rgba(200, 230, 255, 0.9),
    0 0 30px rgba(120, 180, 255, 0.6),
    0 0 50px rgba(120, 180, 255, 0.3);
}

/* Numerito que aparece arriba */
.marcador {
  position: absolute;
  top: -10px;
  right: -10px;

  background: rgba(180, 220, 255, 0.9);
  color: #0f1f3d;

  font-weight: bold;
  width: 28px;
  height: 28px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;

  box-shadow:
    0 0 12px rgba(200, 230, 255, 0.9),
    0 0 25px rgba(120, 180, 255, 0.6);

    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.3);
}

.mezclando{
  animation:mezclar 0.6s ease-in-out infinite alternate;
}

.carta.zoom{
  transform: scale(1.6);
  transition: transform 0.6s ease;
}


@keyframes mezclar{
  from{ transform: translateY(-10px); }
  to{ transform: translateY(10px); }
}

#btnIniciar{
  padding: 14px 32px;
  margin-top: 25px;
  font-size: 16px;
  letter-spacing: 1px;
  font-weight: 600;

  color: rgba(255,255,255,0.9);

  background: linear-gradient(135deg, #0f1f3d, #1c2f5a);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;

  backdrop-filter: blur(6px);

  box-shadow:
    0 0 15px rgba(80,140,255,0.25),
    0 8px 20px rgba(0,0,0,0.4);

  transition: all 0.3s ease;
}

#btnIniciar:hover{
  transform: translateY(-3px);
  box-shadow:
    0 0 25px rgba(120,180,255,0.5),
    0 12px 25px rgba(0,0,0,0.5);
}

#btnIniciar:active{
  transform: translateY(3px) scale(0.97);
  box-shadow:
    0 0 10px rgba(80,140,255,0.2),
    0 4px 10px rgba(0,0,0,0.6);
}

#btnCerrarFinal{
  padding: 12px 28px;
  font-size: 16px;
  letter-spacing: 1px;
  font-weight: 600;

  color: rgba(255,255,255,0.9);

  background: linear-gradient(135deg, #0f1f3d, #1c2f5a);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;

  backdrop-filter: blur(6px);

  box-shadow:
    0 0 15px rgba(80,140,255,0.25),
    0 8px 20px rgba(0,0,0,0.4);

  cursor:pointer;
  transition: all 0.3s ease;
}

#btnCerrarFinal:active{
  transform: translateY(3px) scale(0.97);
  box-shadow:
    0 0 10px rgba(80,140,255,0.2),
    0 4px 10px rgba(0,0,0,0.6);
}

#btnCerrarFinal:hover{
  transform: translateY(-3px);
  box-shadow:
    0 0 25px rgba(120,180,255,0.5),
    0 12px 25px rgba(0,0,0,0.5);
}

#btnCerrarFinal:active{
  transform: translateY(3px) scale(0.97);
  box-shadow:
    0 0 10px rgba(80,140,255,0.2),
    0 4px 10px rgba(0,0,0,0.6);
}
/* 🔮 Nombre debajo de cada carta */
.nombreCarta{
  position: absolute;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-weight: bold;
  font-size: 13px;
  text-shadow: 0 0 10px black;
    z-index: 2000;

}

/* 🌑 Capa oscura al revelar cartas */
.overlayOscuro {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.50);
  backdrop-filter: blur(4px);
  z-index: 500;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.overlayOscuro.activo {
  opacity: 1;
}
@media (max-width:700px){

.carta.zoomFinal{
  scale:2.5;
}

}

</style>
</head>

<body>

<h1>Tres Arcanos - Tarot online</h1>
<p>Debes elegir 3 cartas para cada pregunta</p>

<button id="btnIniciar" onclick="iniciarTirada()">Mezclar y comenzar</button>


<div id="overlayOscuro" class="overlayOscuro"></div>
<div id="mensajeConfirmacion" style="margin-top:20px;font-size:18px;"></div>


<div class="cartas" id="mazo"></div>
<div id="resultado" style="margin-top:30px;font-size:18px;"></div>
<button id="btnSiguiente" style="
  display:none;
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  z-index:2000;
  padding:14px 28px;
  font-size:18px;
  background:gold;
  color:black;
  border:none;
  border-radius:10px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
">
  Elegí las cartas para tu siguiente revelación
</button>


<script>
const esCelular = window.innerWidth < 700;
// 🔊 PRELOAD DE SONIDOS

const sonidos = {
  boton: new Audio("sound/clic.mp3"),
  seleccionar: new Audio("sound/select2.mp3"),
  revelar: new Audio("sound/revelar2.mp3")
};

Object.values(sonidos).forEach(audio => {
  audio.preload = "auto";
});


const arcanos = {
0: "El Loco",
1: "El Mago",
2: "La Sacerdotisa",
3: "La Emperatriz",
4: "El Emperador",
5: "El Sumo Sacerdote",
6: "Los Enamorados",
7: "El Carro",
8: "La Fuerza",
9: "El Ermitaño",
10: "La Rueda de la Fortuna",
11: "La Justicia",
12: "El Colgado",
13: "La Muerte",
14: "La Templanza",
15: "El Diablo",
16: "La Torre",
17: "La Estrella",
18: "La Luna",
19: "El Sol",
20: "El Juicio",
21: "El Mundo"
};

// ==============================
// 🔮 Integración con Make (envío de cartas seleccionadas)
// ==============================

function enviarCartasAMake(cartas, nombres, invertidas) {

  fetch("https://hook.us2.make.com/jp7gpnwfrykmtqupjjhksskpv8slgtwg", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      order_id: orderId,
  

      carta_1_num: cartas[0],
      carta_1_nombre: nombres[0],
      carta_1_invertida: invertidas[0],

      carta_2_num: cartas[1],
      carta_2_nombre: nombres[1],
      carta_2_invertida: invertidas[1],

      carta_3_num: cartas[2],
      carta_3_nombre: nombres[2],
      carta_3_invertida: invertidas[2]
    })
  })
  .then(() => {
    document.getElementById("mensajeConfirmacion").innerHTML =
      "✨ Tus cartas fueron registradas correctamente ✨";
  })
  .catch(() => {
    document.getElementById("mensajeConfirmacion").innerHTML =
      "⚠ Error al registrar la tirada";
  });

}

// ==============================
// 🔮 DATOS RECIBIDOS DESDE LA URL (Make / Tienda)
// ==============================

const params = new URLSearchParams(window.location.search);
const orderId = params.get("orden");
const cantidadPreguntas = parseInt(params.get("preguntas"));
const cartasPorTirada = 3;

if (!orderId || !cantidadPreguntas) {
  document.getElementById("mensajeConfirmacion").innerHTML =
    "⚠ No se detectaron datos de orden en el enlace.";
}


let mazo = Array.from({length: 22}, (_, i) => i);
let seleccionadas=[];
let cartasDOM=[];
let tiradaActiva=false;
let tiradaActual = 1;
let todasLasTiradas = [];

document.getElementById("btnSiguiente").addEventListener("click", function() {

sonidos.boton.currentTime = 0;
sonidos.boton.play();
  
  tiradaActual++;

  this.style.display = "none";

  seleccionadas = [];
  cartasDOM = [];
  contenedor.innerHTML = "";
  document.getElementById("overlayOscuro").classList.remove("activo");

  iniciarTirada();

});


const contenedor=document.getElementById("mazo");

/* MEZCLA VISUAL + REAL */
function iniciarTirada(){
  sonidos.boton.currentTime = 0;
  sonidos.boton.play();

  document.getElementById("btnIniciar").disabled = true;

  seleccionadas=[];
  contenedor.innerHTML="";
  tiradaActiva=true;

  // Fisher-Yates real
  for(let i=mazo.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [mazo[i], mazo[j]]=[mazo[j], mazo[i]];
  }

  mazo.forEach((numero, index)=>{

    const carta=document.createElement("div");
    carta.className="carta mezclando";

    const inner=document.createElement("div");
    inner.className="inner";

    const dorso=document.createElement("div");
    dorso.className="dorso";

    const frente=document.createElement("div");
    frente.className="frente";
    frente.style.backgroundImage=`url('img/${numero}.png')`;

    inner.appendChild(dorso);
    inner.appendChild(frente);
    carta.appendChild(inner);

    carta.dataset.numero=numero;
    
if(!esCelular){

// 🔮 ABANICO PARA PC

const totalCartas = mazo.length;

const centroX = window.innerWidth / 2;
const header = document.querySelector("h1");
const headerBottom = header.getBoundingClientRect().bottom;
const centroY = headerBottom + 100;

const anguloInicial = -55;
const anguloFinal = 55;
const curvatura = 520;

const progreso = index / (totalCartas - 1);
const angulo = anguloInicial + progreso * (anguloFinal - anguloInicial);

const anchoAbanico = 650;
const x = centroX - anchoAbanico / 2 + progreso * anchoAbanico;

const offset = progreso - 0.5;
const y = centroY + curvatura * (offset * offset);

carta.style.left = (x - 75) + "px";
carta.style.top = (y - 125) + "px";

const anguloFinalCarta = angulo * 0.6;

carta.style.transform = `rotate(${anguloFinalCarta}deg)`;
carta.style.transformOrigin = "center bottom";

}else{

// 📱 GRILLA PARA CELULAR

const columnas = 4;
const espacioX = 110;
const espacioY = 140;

const fila = Math.floor(index / columnas);
const columna = index % columnas;

const centroX = window.innerWidth / 2;

const x = centroX - ((columnas - 1) * espacioX)/2 + columna * espacioX;
const y = 5 + fila * espacioY;

carta.style.left = (x - 50) + "px";
carta.style.top = y + "px";

}

    carta.onclick=()=>{
      if(!tiradaActiva) return;
      if(seleccionadas.length >= cartasPorTirada) return;
      if(seleccionadas.includes(carta)) return;

      carta.classList.remove("mezclando");
      seleccionadas.push(carta);
      if (seleccionadas.length < 3) {
  sonidos.seleccionar.currentTime = 0;
sonidos.seleccionar.play();
}


      // Agrega efecto visual de seleccion
carta.classList.add("seleccionada");

// Crear numerito indicador (1, 2 o 3)
const marcador = document.createElement("div");
marcador.className = "marcador";
marcador.textContent = seleccionadas.length;
carta.appendChild(marcador);


      if(seleccionadas.length === cartasPorTirada){
        revelarCartas();
      }
    };

    cartasDOM.push(carta);
    contenedor.appendChild(carta);
  });

  // corta animación mezcla después de 1.5s
  setTimeout(()=>{
    cartasDOM.forEach(c=>c.classList.remove("mezclando"));
  },1500);
}

function revelarCartas(){
sonidos.revelar.currentTime = 0;
sonidos.revelar.play();


  tiradaActiva=false;

// 🔮 Oscurecer fondo al revelar
  document.getElementById("overlayOscuro").classList.add("activo");


  seleccionadas.forEach((carta, i)=>{

  carta.style.zIndex = 999;

  if(esCelular){

  // 📱 REVELACIÓN VERTICAL EN CELULAR

  const centroX = window.innerWidth / 2;

  carta.style.left = (centroX - 75) + "px";
  carta.style.top = (120 + i * 400) + "px";

}else{

  // 💻 REVELACIÓN HORIZONTAL EN PC

  const centroX = window.innerWidth / 2;
  const anchoCarta = 220;
  const separacionFinal = 300;
  const desplazamiento = (i - 1) * separacionFinal;

  carta.style.left = (centroX - anchoCarta/2 + desplazamiento) + "px";
  carta.style.top = "80px";

}

    // Enderezar carta (quitar curvatura del abanico)
  carta.style.transform = "rotate(0deg)";

  if(Math.random()<0.5){
    carta.classList.add("invertida");
  }

  carta.classList.add("flip");
  carta.classList.add("zoomFinal");

  // Crear nombre debajo de la carta
const nombre = document.createElement("div");
nombre.className = "nombreCarta";
const numero = parseInt(carta.dataset.numero);
nombre.textContent = arcanos[numero] || "Carta " + numero;

carta.appendChild(nombre);

});


  // bloquea el resto
  cartasDOM.forEach(c=>{
    if(!seleccionadas.includes(c)){
      c.classList.add("bloqueada");
    }
  });

  console.log("Order ID:", orderId);

  // 🔮 Enviar cartas a Make
const numeros = seleccionadas.map(c => parseInt(c.dataset.numero));
const nombres = numeros.map(n => arcanos[n]);
const invertidas = seleccionadas.map(c => 
  c.classList.contains("invertida") ? "invertida" : ""
);

const cartasFinales = nombres.map((nombre, i) => {
  return invertidas[i] === "invertida"
    ? nombre + " (invertida)"
    : nombre;
});

todasLasTiradas.push({
  tirada: tiradaActual,
  cartas: cartasFinales
});
  console.log("Tirada actual:", tiradaActual, "Cantidad comprada:", cantidadPreguntas);
  
  if (tiradaActual < cantidadPreguntas) {
    console.log("Entró al bloque de siguiente revelación");
    document.getElementById("overlayOscuro").classList.remove("activo");
    const btn = document.getElementById("btnSiguiente");

  const textoNumero =
    tiradaActual === 1 ? "segunda" :
    tiradaActual === 2 ? "tercera" : "siguiente";

  btn.textContent = "Elegí las cartas para tu " + textoNumero + " revelación";
  btn.style.display = "inline-block";

} else {

  const btn = document.getElementById("btnSiguiente");
  btn.style.display = "none";
  // 🔮 Enviar TODAS las tiradas juntas a Make
fetch("https://hook.us2.make.com/tpwlpxfgyhjn9idp4zii4mkehgqd7xc3", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    order_id: orderId,
    cantidad_tiradas: cantidadPreguntas,
    tiradas: todasLasTiradas
  })
})
.then(() => {
  console.log("Todas las tiradas enviadas correctamente");
})
.catch(() => {
  console.log("Error al enviar las tiradas");
});

  // Activar overlay
  document.getElementById("overlayOscuro").classList.add("activo");

  // Crear contador centrado
  const contador = document.createElement("div");
  contador.style.position = "fixed";
  contador.style.top = "120px";
  contador.style.left = "50%";
  contador.style.transform = "translate(-50%, -50%)";
  contador.style.zIndex = "3000";
  contador.style.fontSize = "60px";
  contador.style.color = "white";
  contador.style.fontWeight = "bold";
  contador.style.textShadow = `
  0 0 15px rgba(200,230,255,0.9),
  0 0 35px rgba(120,180,255,0.7),
  0 0 60px rgba(80,140,255,0.5)`;
  contador.style.transition = "opacity 0.6s ease";
  contador.style.opacity = "1";
  contador.textContent = "5";

  document.body.appendChild(contador);

  let tiempo = esCelular ? 10 : 5;

  const intervalo = setInterval(() => {
    tiempo--;
contador.style.opacity = "0";

setTimeout(() => {
  contador.textContent = tiempo;
  contador.style.opacity = "1";
}, 300);

    if (tiempo === 0) {
      clearInterval(intervalo);
      contador.remove();
      mostrarMensajeFinal();
    }
  }, 1000);

  function mostrarMensajeFinal() {

    const modal = document.createElement("div");
    modal.style.position = "fixed";
    modal.style.top = "50%";
    modal.style.left = "50%";
    modal.style.transform = "translate(-50%, -50%) scale(0.9)";
    modal.style.zIndex = "3000";
    modal.style.background = "rgba(10, 20, 45, 0.85)";
    modal.style.color = "white";
    modal.style.backdropFilter = "blur(10px)";
    modal.style.border = "1px solid rgba(255,255,255,0.1)";
    modal.style.padding = "45px";
    modal.style.borderRadius = "20px";
    modal.style.maxWidth = "520px";
    modal.style.textAlign = "center";
    modal.style.boxShadow = "0 0 40px rgba(80, 140, 255, 0.3)";
    modal.style.fontSize = "18px";
    modal.style.opacity = "0";
    modal.style.transition = "all 0.4s ease";

    modal.innerHTML = `
      <div style="font-size:40px; margin-bottom:15px;">✨</div>
      <h2 style="margin-bottom:20px; font-size:26px;">Gracias</h2>
      <p style="line-height:1.6; margin-bottom:25px;">
        Tus cartas ya fueron reveladas.<br><br>
        En breve vamos a analizar cuidadosamente tu tirada
        y recibirás la interpretación completa en tu correo electrónico.
      </p>
      <button id="btnCerrarFinal">
  Cerrar
  </button>
    `;

    document.body.appendChild(modal);

    setTimeout(() => {
      modal.style.opacity = "1";
      modal.style.transform = "translate(-50%, -50%) scale(1)";
    }, 50);

  document.getElementById("btnCerrarFinal").addEventListener("click", function() {

  sonidos.boton.currentTime = 0;
  sonidos.boton.play();

  sonidos.boton.onended = function() {
    window.location.href = "https://www.tresarcanos.com";
  };

});

  }
}
}

</script>

</body>
</html>
